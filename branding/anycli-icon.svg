<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">AnyCli icon</title>
  <desc id="desc">A terminal prompt in a purple window frame.</desc>
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512BD4"/>
      <stop offset="1" stop-color="#8A6CFF"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="24" y="24" width="112" height="112" rx="22"/>
    </clipPath>
  </defs>
  <rect x="24" y="24" width="112" height="112" rx="22" fill="#12121A" stroke="url(#window)" stroke-width="4"/>
  <g clip-path="url(#windowClip)">
    <rect x="24" y="24" width="112" height="28" fill="url(#window)"/>
    <circle cx="42" cy="38" r="5" fill="#F5F5FF" fill-opacity="0.95"/>
    <circle cx="58" cy="38" r="5" fill="#F5F5FF" fill-opacity="0.7"/>
    <circle cx="74" cy="38" r="5" fill="#F5F5FF" fill-opacity="0.45"/>
  </g>
  <path d="M52 68 L76 84 L52 100" fill="none" stroke="#C9B8FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="88" y="94" width="28" height="10" rx="5" fill="#F5F5FF"/>
</svg>
